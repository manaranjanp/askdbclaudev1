name: sample
path: ${SAMPLE_DB_PATH}
tables:
  sales:
    description: One row per sale, with the region it was made in.
    columns:
      id:
        description: Sale identifier.
      region:
        description: Sales region name, such as North or South.
      amount:
        description: Sale value in the reporting currency.
metrics:
  revenue:
    description: Total sales amount across all orders.
    synonyms:
      - revenue
      - sales total
    table: sales
    sql: SUM(sales.amount)
