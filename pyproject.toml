[project]
name = "nl-db-query"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "sqlglot>=25",
    "pyyaml>=6",
    "argon2-cffi>=25.1.0",
    "anthropic>=1.17.0",
    "fastembed>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["real_model: loads the local embedding model; runs only with --real-model"]

[tool.mypy]
strict = true
python_version = "3.11"
